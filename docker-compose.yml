services:
  bot:
    build: .
    init: true
    env_file: .env
    entrypoint: ["ionice", "-c3", "nice", "-n", "15", "python", "-m", "src.main"]
    environment:
      - DB_PATH=/app/data/steam_watcher.db
      - DOTABUFF_BROWSER_ENABLED=1
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    restart: unless-stopped
