services:
  bot:
    build:
      context: .
      args:
        INSTALL_DOTABUFF_BROWSER: ${INSTALL_DOTABUFF_BROWSER:-0}
        INSTALL_LOCAL_CHROMIUM: ${INSTALL_LOCAL_CHROMIUM:-0}
    init: true
    env_file: .env
    entrypoint: ["ionice", "-c3", "nice", "-n", "15", "python", "-m", "src.main"]
    environment:
      - DB_PATH=/app/data/steam_watcher.db
      - DOTABUFF_BROWSER_ENABLED=${DOTABUFF_BROWSER_ENABLED:-0}
      - DOTABUFF_BROWSER_WS_ENDPOINT=${DOTABUFF_BROWSER_WS_ENDPOINT:-}
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    restart: unless-stopped
    # Bot alone runs ~150MB. If you re-enable the chromium worker
    # (INSTALL_LOCAL_CHROMIUM=1 + DOTABUFF_BROWSER_ENABLED=1), raise this to
    # 1g / pids 256 — a resident browser peaks around 400MB and ~100 threads.
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Watcher loop rewrites the heartbeat file every iteration (10s cadence);
    # stale for >180s means the loop is wedged or dead.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p=os.environ.get('HEARTBEAT_PATH','/tmp/steam-watcher-heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
